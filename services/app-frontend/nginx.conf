server {
    listen 4040;
    root /usr/share/nginx/html;
    index index.html;

    # Reverse proxy: app-backend (direct, no Kong)
    location /api/ {
        proxy_pass http://app-backend:3042/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Reverse proxy: websocket
    location /websocket {
        proxy_pass http://app-backend:3042/websocket;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }

    # Reverse proxy: Kong gateway (all other services)
    location /jwt/ {
        proxy_pass http://kong:8000/jwt/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /public/ {
        proxy_pass http://kong:8000/public/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /private/ {
        proxy_pass http://kong:8000/private/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # SPA: serve index.html for all other routes
    location / {
        try_files $uri $uri/ /index.html;
    }
}
